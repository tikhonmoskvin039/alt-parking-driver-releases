name: rustore-draft-inspection

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: Exact RuStore Driver draft ID (2064928626)
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Check out protected public controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate exact draft ID before accessing credentials
        shell: bash
        env:
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          if [[ ! "$VERSION_ID" =~ ^[1-9][0-9]*$ ]] || [[ "$VERSION_ID" != "2064928626" ]]; then
            echo 'Unexpected RuStore version ID' >&2
            exit 2
          fi

      - name: Inspect draft with authenticated GET only
        shell: bash
        env:
          VERSION_ID: ${{ inputs.version_id }}
          RUSTORE_SUBMIT_KEY_ID: ${{ secrets.RUSTORE_SUBMIT_KEY_ID }}
          RUSTORE_SUBMIT_PRIVATE_KEY_PKCS8_BASE64: ${{ secrets.RUSTORE_SUBMIT_PRIVATE_KEY_PKCS8_BASE64 }}
        run: python -m tool.rustore_inspect --version-id "$VERSION_ID"
